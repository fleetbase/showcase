# Passenger app screenshots: the iOS Simulator and the Android Emulator, against the same seeded
# release stack the console screenshots use, driven by the app's own Maestro flows
# (passenger-app/.maestro/screenshots), with a driver actor (scripts/mobile/passenger-driver.py)
# taking each trip through the Fleetbase API between flows. Proposes the changed images to
# fleetbase.io under public/images/screenshots/passenger-app/{ios,android}/ when asked to.
#
# Shaped like storefront-app-screenshots.yml, and for the same reasons (see that file): the stack
# runs on Ubuntu behind a cloudflared tunnel, iOS captures on macOS, Android on its own Ubuntu
# runner, and the jobs talk through artifacts. Passenger has one build rather than four editions,
# so one capture job per platform.
#
#   stack    ubuntu  boots the stack behind the tunnel and seeds the organization, its API key
#                    and the Passenger area (car classes, drivers, the rider, her trips)
#   android  ubuntu  builds the app against the tunnel and captures on an emulator (KVM)
#   ios      macOS   builds the app against the tunnel and captures on the simulator
#   gallery  ubuntu  the review page
#   publish  ubuntu  encodes, compares against fleetbase.io, opens the pull request (open_pr)
#
# passenger-app is a private repository until it launches, so its checkout needs a token:
# PASSENGER_APP_TOKEN, a fine-grained token with read access to the contents of
# fleetbase/passenger-app. Without it the checkout falls back to this workflow's own token,
# which works once the repository is public.
name: Passenger app screenshots

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'passenger-app ref (tag or branch) whose build and flows to capture'
        required: false
        default: 'main'
      release_tag:
        description: 'Fleetbase release for the API (vX.Y.Z or "latest")'
        required: false
        default: 'latest'
      platforms:
        description: 'Space-separated: ios android'
        required: false
        default: 'ios android'
      themes:
        description: 'Space-separated: dark light'
        required: false
        default: 'dark light'
      open_pr:
        description: 'Open a pull request on fleetbase.io with the changed screenshots'
        type: boolean
        required: false
        default: false
  # For passenger-app's release workflow, once it sends one (it does not yet).
  repository_dispatch:
    types: [passenger-app-release]

permissions:
  contents: read
  actions: read

concurrency:
  group: passenger-app-screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  # The seeded rider (PassengerSeeder::RIDER_PHONE, Sophie Lim), as the app submits it.
  RIDER_PHONE: '+6591000301'
  APP_REPO: fleetbase/passenger-app

jobs:
  config:
    name: Resolve inputs
    runs-on: ubuntu-latest
    outputs:
      app_ref: ${{ steps.cfg.outputs.app_ref }}
      tag: ${{ steps.cfg.outputs.tag }}
      ios: ${{ steps.cfg.outputs.ios }}
      android: ${{ steps.cfg.outputs.android }}
      themes: ${{ steps.cfg.outputs.themes }}
      markers: ${{ steps.cfg.outputs.markers }}
      open_pr: ${{ steps.cfg.outputs.open_pr }}
    steps:
      - id: cfg
        env:
          DISPATCH_APP_TAG: ${{ github.event.client_payload.tag }}
          INPUT_APP_REF: ${{ inputs.app_ref }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_THEMES: ${{ inputs.themes }}
        run: |
          set -euo pipefail
          APP_REF="${INPUT_APP_REF:-${DISPATCH_APP_TAG:-main}}"
          TAG="${INPUT_TAG:-latest}"
          PLATFORMS="${INPUT_PLATFORMS:-ios android}"
          THEMES="${INPUT_THEMES:-dark light}"
          for theme in $THEMES; do
            [[ "$theme" == dark || "$theme" == light ]] || { echo "::error::themes: unknown theme $theme"; exit 1; }
          done

          # Same rule as the console run: "latest" becomes the newest vX.Y.Z published for
          # both images, so the artifact and pull request name a real version.
          if [[ "$TAG" == "latest" ]]; then
            TAG="$(python3 - <<'PY'
          import json, re, sys, urllib.request
          def tags(repo):
              out, url = set(), f"https://hub.docker.com/v2/repositories/fleetbase/{repo}/tags/?page_size=100"
              while url:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      page = json.load(r)
                  out |= {t["name"] for t in page["results"] if re.fullmatch(r"v\d+\.\d+\.\d+", t["name"])}
                  url = page.get("next")
              return out
          both = tags("fleetbase-console") & tags("fleetbase-api")
          if not both:
              sys.exit("no vX.Y.Z tag is published for both fleetbase-console and fleetbase-api")
          print(max(both, key=lambda t: tuple(int(n) for n in t[1:].split("."))))
          PY
          )"
          fi

          OPEN_PR=false
          [[ "${{ inputs.open_pr }}" == "true" ]] && OPEN_PR=true
          if [[ "${{ github.event_name }}" == "repository_dispatch" && "${{ vars.OPEN_PR_ON_RELEASE }}" == "true" ]]; then
            OPEN_PR=true
          fi

          # The capture jobs' done markers the stack waits for.
          MARKERS=""
          for platform in ios android; do
            [[ " $PLATFORMS " == *" $platform "* ]] && MARKERS="$MARKERS passenger-done-$platform"
          done

          {
            echo "app_ref=$APP_REF"
            echo "tag=$TAG"
            echo "ios=$([[ " $PLATFORMS " == *" ios "* ]] && echo true || echo false)"
            echo "android=$([[ " $PLATFORMS " == *" android "* ]] && echo true || echo false)"
            echo "themes=$THEMES"
            echo "markers=${MARKERS# }"
            echo "open_pr=$OPEN_PR"
          } >> "$GITHUB_OUTPUT"
          echo "passenger-app $APP_REF against Fleetbase $TAG ($PLATFORMS; $THEMES; open_pr=$OPEN_PR)"

  stack:
    name: Stack
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Require SHOWCASE_PASSWORD
        run: |
          if [[ -z "${{ secrets.SHOWCASE_PASSWORD }}" ]]; then
            echo "::error::SHOWCASE_PASSWORD is not set."
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Open the tunnel
        id: tunnel
        run: echo "url=$(./scripts/mobile/tunnel.sh)" >> "$GITHUB_OUTPUT"

      # A fresh sign-in code per run. The server accepts it only for RIDER_PHONE, and the stack
      # it unlocks is gone when the run ends.
      - name: Generate the sign-in code
        id: code
        run: echo "value=$(python3 -c 'import secrets; print(f"{secrets.randbelow(10**6):06d}")')" >> "$GITHUB_OUTPUT"

      - name: Start the stack
        env:
          RELEASE_TAG: ${{ needs.config.outputs.tag }}
          APP_URL: ${{ steps.tunnel.outputs.url }}
          FLEETOPS_CUSTOMER_VERIFICATION_BYPASS_CODE: ${{ steps.code.outputs.value }}
          FLEETOPS_CUSTOMER_REVIEW_ACCOUNTS: ${{ env.RIDER_PHONE }}
          # Optional. With a key the API can name the rider's pickup from her coordinates (a
          # reverse geocode); without one the app shows "Current location".
          GOOGLE_MAPS_API_KEY: ${{ secrets.PASSENGER_APP_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: ./scripts/up.sh

      - name: Provision
        run: ./scripts/provision.sh

      # Only what the app needs: the organization, the API key (Developers) and the Passenger
      # area. The other areas would put their delivery service rates in the app's car classes:
      # Fleet-Ops quotes every rate the company has, and has no way yet to ask for one order
      # config's.
      - name: Seed fixtures
        env:
          SHOWCASE_PASSWORD: ${{ secrets.SHOWCASE_PASSWORD }}
        run: |
          ./scripts/seed.sh organization
          ./scripts/seed.sh developers
          ./scripts/seed.sh passenger

      - name: Read Passenger fixtures
        run: ./scripts/mobile/passenger-fixtures.sh

      - name: Check the stack through the tunnel
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "${{ steps.tunnel.outputs.url }}/health" >/dev/null
          echo "Stack reachable at ${{ steps.tunnel.outputs.url }}"

      - name: Share the stack with the capture jobs
        env:
          STACK_KEY: ${{ secrets.SHOWCASE_PASSWORD }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          json.dump({
              'url': '${{ steps.tunnel.outputs.url }}',
              'code': '${{ steps.code.outputs.value }}',
              'fixtures': json.load(open('.passenger-fixtures.json')),
          }, open('passenger-stack.json', 'w'))
          PY
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:STACK_KEY -in passenger-stack.json -out passenger-stack.json.enc
          rm passenger-stack.json

      - uses: actions/upload-artifact@v4
        with:
          name: passenger-stack
          path: passenger-stack.json.enc
          retention-days: 1

      - name: Wait for the capture jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r -a wanted <<<"${{ needs.config.outputs.markers }}"
          deadline=$(( $(date +%s) + 120 * 60 ))
          for marker in "${wanted[@]}"; do
            until gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name' | grep -qx "$marker"; do
              if (( $(date +%s) > deadline )); then
                echo "::warning::Gave up waiting for ${marker} after 120 minutes."
                break 2
              fi
              sleep 20
            done
            echo "${marker} received"
          done

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true

      - name: Tear down
        if: always()
        run: |
          [[ -f .tunnel.pid ]] && kill "$(cat .tunnel.pid)" 2>/dev/null || true
          docker compose down -v || true

  android:
    name: Android
    needs: config
    if: needs.config.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout passenger-app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.config.outputs.app_ref }}
          token: ${{ secrets.PASSENGER_APP_TOKEN || github.token }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('app/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install app dependencies
        working-directory: app
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'true'
        run: |
          corepack enable
          yarn install --immutable

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/CodeQL" /usr/local/share/powershell /usr/share/swift || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      - name: Wait for the stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 90 * 60 ))
          until gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name' | grep -qx 'passenger-stack'; do
            if (( $(date +%s) > deadline )); then
              echo "::error::The stack job did not become ready within 90 minutes."
              exit 1
            fi
            sleep 20
          done

      - uses: actions/download-artifact@v4
        with:
          name: passenger-stack
          path: .

      - name: Read the stack
        id: stack
        env:
          STACK_KEY: ${{ secrets.SHOWCASE_PASSWORD }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STACK_KEY -in passenger-stack.json.enc -out passenger-stack.json
          URL="$(python3 -c "import json; print(json.load(open('passenger-stack.json'))['url'])")"
          CODE="$(python3 -c "import json; print(json.load(open('passenger-stack.json'))['code'])")"
          KEY="$(python3 -c "import json; print(json.load(open('passenger-stack.json'))['fixtures']['api_key'])")"
          echo "::add-mask::$CODE"
          echo "::add-mask::$KEY"
          python3 -c "import json; json.dump(json.load(open('passenger-stack.json'))['fixtures'], open('.passenger-fixtures.json', 'w'))"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # Before the emulator boots: Gradle's native compile next to a running emulator starves the
      # runner (see the Storefront workflow).
      - name: Build the APK
        env:
          CAPTURE_PHASE: build
          GOOGLE_MAPS_API_KEY: ${{ secrets.PASSENGER_APP_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: ./scripts/mobile/passenger-capture.sh android app "${{ steps.stack.outputs.url }}"

      - name: Stop the build daemons
        run: |
          (cd app/android && ./gradlew --stop) || true
          pkill -f KotlinCompileDaemon || true
          pkill -f GradleDaemon || true
          free -h

      - name: Capture Android
        if: hashFiles('capture/out/builds/passenger.apk') != ''
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CAPTURE_THEMES: ${{ needs.config.outputs.themes }}
          PASSENGER_VERIFICATION_CODE: ${{ steps.stack.outputs.code }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.PASSENGER_APP_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: 6000M
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -timezone Asia/Singapore
          # As for Storefront: no system dialogs, wait for the first-boot setup and the network,
          # then demo mode for a fixed status bar.
          script: |
            adb shell settings put global hide_error_dialogs 1
            for i in $(seq 120); do [ "$(adb shell settings get global device_provisioned | tr -d '\r')" = 1 ] && adb shell dumpsys connectivity | grep -qE 'Active default network: [0-9]' && echo "device provisioned and online after $((i * 2))s" && exit 0; sleep 2; done; echo "::warning::emulator not provisioned/online after 240s; capturing anyway"
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            CAPTURE_PHASE=run ./scripts/mobile/passenger-capture.sh android app "${{ steps.stack.outputs.url }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passenger-app-android
          path: capture/out/passenger-app/android
          if-no-files-found: warn
          retention-days: 14

      - name: Signal done
        if: always()
        run: echo 'done' > done.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passenger-done-android
          path: done.txt
          retention-days: 1

  ios:
    name: iOS
    needs: config
    if: needs.config.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout passenger-app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.config.outputs.app_ref }}
          token: ${{ secrets.PASSENGER_APP_TOKEN || github.token }}
          path: app

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: app
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('app/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install app dependencies
        working-directory: app
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'true'
        run: |
          corepack enable
          yarn install --immutable

      # iPhone 16 Pro Max (1320×2868) on the newest iOS runtime, in Singapore time, like the
      # Storefront capture. Booted now and waited for after the build.
      - name: Boot the simulator
        id: sim
        run: |
          set -euo pipefail
          sudo systemsetup -settimezone Asia/Singapore >/dev/null 2>&1 || true
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          r = [x for x in json.load(sys.stdin)['runtimes'] if x['platform'] == 'iOS' and x['isAvailable']]
          print(max(r, key=lambda x: tuple(int(n) for n in x['version'].split('.')))['identifier'])
          ")"
          UDID="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          match = next((d for d in json.load(sys.stdin)['devices'].get('$RUNTIME', []) if d['name'] == 'iPhone 16 Pro Max'), None)
          print(match['udid'] if match else '')
          ")"
          if [[ -z "$UDID" ]]; then
            UDID="$(xcrun simctl create 'iPhone 16 Pro Max' com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max "$RUNTIME")"
          fi
          echo "iPhone 16 Pro Max on $RUNTIME: $UDID"
          xcrun simctl boot "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos/trunk
          key: passenger-pods-${{ runner.os }}-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: passenger-pods-${{ runner.os }}-

      - name: Install pods
        working-directory: app/ios
        run: bundle exec pod install

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Wait for the stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 90 * 60 ))
          until gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name' | grep -qx 'passenger-stack'; do
            if (( $(date +%s) > deadline )); then
              echo "::error::The stack job did not become ready within 90 minutes."
              exit 1
            fi
            sleep 20
          done

      - uses: actions/download-artifact@v4
        with:
          name: passenger-stack
          path: .

      - name: Read the stack
        id: stack
        env:
          STACK_KEY: ${{ secrets.SHOWCASE_PASSWORD }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STACK_KEY -in passenger-stack.json.enc -out passenger-stack.json
          URL="$(python3 -c "import json; print(json.load(open('passenger-stack.json'))['url'])")"
          CODE="$(python3 -c "import json; print(json.load(open('passenger-stack.json'))['code'])")"
          KEY="$(python3 -c "import json; print(json.load(open('passenger-stack.json'))['fixtures']['api_key'])")"
          echo "::add-mask::$CODE"
          echo "::add-mask::$KEY"
          python3 -c "import json; json.dump(json.load(open('passenger-stack.json'))['fixtures'], open('.passenger-fixtures.json', 'w'))"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build the app
        env:
          CAPTURE_PHASE: build
        run: ./scripts/mobile/passenger-capture.sh ios app "${{ steps.stack.outputs.url }}"

      - name: Wait for the simulator
        if: hashFiles('capture/out/builds/passenger.app/Info.plist') != ''
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --dataNetwork wifi

      - name: Start the Maestro driver
        if: hashFiles('capture/out/builds/passenger.app/Info.plist') != ''
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
        run: |
          for attempt in 1 2 3; do
            if maestro --device "${{ steps.sim.outputs.udid }}" hierarchy >/dev/null 2>&1; then
              echo "Maestro driver ready (attempt ${attempt})"
              exit 0
            fi
            echo "Maestro driver not ready (attempt ${attempt})"
          done
          echo "::warning::The Maestro driver did not start; the first flow will try again."

      - name: Capture iOS
        if: hashFiles('capture/out/builds/passenger.app/Info.plist') != ''
        env:
          CAPTURE_PHASE: run
          CAPTURE_THEMES: ${{ needs.config.outputs.themes }}
          SIMULATOR_ID: ${{ steps.sim.outputs.udid }}
          PASSENGER_VERIFICATION_CODE: ${{ steps.stack.outputs.code }}
        run: ./scripts/mobile/passenger-capture.sh ios app "${{ steps.stack.outputs.url }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passenger-app-ios
          path: capture/out/passenger-app/ios
          if-no-files-found: warn
          retention-days: 14

      - name: Signal done
        if: always()
        run: echo 'done' > done.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passenger-done-ios
          path: done.txt
          retention-days: 1

  gallery:
    name: Gallery
    needs: [config, android, ios]
    if: always() && needs.config.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install capture dependencies
        working-directory: capture
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          pattern: passenger-app-*
          path: capture/out/raw

      - name: Build the gallery
        run: |
          node capture/bin/gallery-mobile.mjs --app passenger-app \
            --ios capture/out/raw/passenger-app-ios \
            --android capture/out/raw/passenger-app-android \
            --out capture/out/passenger-app-gallery \
            --run "${{ github.run_id }}" \
            --app-ref "${{ needs.config.outputs.app_ref }}" \
            --release "${{ needs.config.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        id: gallery
        with:
          name: passenger-app-gallery
          path: capture/out/passenger-app-gallery
          retention-days: 90

      - name: Link the gallery
        run: |
          {
            echo ""
            echo "**[Download the screenshot gallery](${{ steps.gallery.outputs.artifact-url }})**, unzip it and open \`index.html\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if any flow stopped early
        run: |
          failed=0
          for platform in ios android; do
            f="capture/out/raw/passenger-app-$platform/failures.txt"
            if [[ -s "$f" ]]; then
              echo "::error::$platform flows stopped early:"
              sed "s/^/  /" "$f"
              failed=1
            fi
          done
          exit $failed

  publish:
    name: Publish
    needs: [config, stack, android, ios]
    if: always() && needs.config.outputs.open_pr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install capture dependencies
        working-directory: capture
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          pattern: passenger-app-*
          path: capture/out/raw

      - name: Checkout fleetbase.io
        uses: actions/checkout@v4
        with:
          repository: fleetbase/fleetbase.io
          token: ${{ secrets.FLEETBASE_IO_TOKEN }}
          path: fleetbase-io

      - name: Encode and compare
        id: compare
        run: |
          set -euo pipefail
          for platform in ios android; do
            src="capture/out/raw/passenger-app-$platform"
            [[ -d "$src" ]] || { echo "No $platform screenshots in this run."; continue; }
            echo "::group::$platform"
            mkdir -p "fleetbase-io/public/images/screenshots/passenger-app/$platform"
            node capture/bin/encode-mobile.mjs --new "$src" --out "capture/out/passenger-app-$platform" --area "passenger-app/$platform"
            # No DOM hash on a phone: an empty baseline makes the gate pixels-only.
            node capture/bin/compare.mjs \
              --new "capture/out/passenger-app-$platform" \
              --current "fleetbase-io/public/images/screenshots/passenger-app/$platform" \
              --staged "fleetbase-io/public/images/screenshots/passenger-app/$platform" \
              --report "capture/out/passenger-app-$platform/report.json" \
              --hash-baseline "capture/out/passenger-app-$platform/.baseline.json"
            echo "::endgroup::"
          done
          cd fleetbase-io
          echo "changed=$(git status --porcelain public/images/screenshots/passenger-app | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Collect flow failures
        id: failures
        run: |
          {
            echo 'list<<FLOW_FAILURES_EOF'
            for platform in ios android; do
              f="capture/out/raw/passenger-app-$platform/failures.txt"
              [[ -s "$f" ]] && sed "s/^/- $platform: /" "$f"
            done
            echo FLOW_FAILURES_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.compare.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          path: fleetbase-io
          token: ${{ secrets.FLEETBASE_IO_TOKEN }}
          base: main
          branch: automation/passenger-app-screenshots/${{ needs.config.outputs.app_ref }}
          delete-branch: true
          add-paths: public/images/screenshots/passenger-app/**
          commit-message: 'Refresh Passenger app screenshots for ${{ needs.config.outputs.app_ref }}'
          title: 'Refresh Passenger app screenshots for ${{ needs.config.outputs.app_ref }}'
          labels: automated
          body: |
            iOS Simulator (iPhone 16 Pro Max) and Android Emulator (Pixel 7 Pro) screenshots of
            passenger-app `${{ needs.config.outputs.app_ref }}` against Fleetbase
            `${{ needs.config.outputs.tag }}`, captured by
            [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Files without a suffix are dark; `-light.webp` files are the light appearance.

            ${{ steps.failures.outputs.list != '' && '**Not in this pull request.** These flows failed:' || '' }}
            ${{ steps.failures.outputs.list }}
