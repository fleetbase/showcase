name: Console Screenshots

# Boots a Fleetbase release from the PUBLISHED Docker images, seeds the showcase fixtures,
# captures the console, and uploads the screenshots as an artifact for review.
#
# Run it by hand from the Actions tab (Run workflow). Opening a pull request on fleetbase.io is
# opt-in — leave `open_pr` false and the run only produces an artifact, which is what you want
# while iterating on fixtures and manifests.
#
# `repository_dispatch` is sent by fleetbase/fleetbase's publish-docker-images.yml after each
# tag's images are pushed, carrying the tag in client_payload. Those runs produce an artifact
# only, unless the repository variable OPEN_PR_ON_RELEASE is "true".
#
# release_tag defaults to `latest`, which resolves to the newest vX.Y.Z published for BOTH
# images on Docker Hub — never the ambiguous :latest Docker tag.
#
# SETUP
#   Secret SHOWCASE_PASSWORD  — the seeded demo account's password. Any strong value; it only
#                               ever exists inside a throwaway stack.
#   Secret FLEETBASE_IO_TOKEN — only needed when open_pr is true. Fine-grained PAT scoped to
#                               fleetbase/fleetbase.io with Contents and Pull requests
#                               read/write, and nothing else.
#
# WHY IT TAKES SO LONG. deploy.sh's PermissionSeeder alone runs ~9 minutes, before any capture
# happens. The timeout below allows for that; do not tighten it without measuring.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Fleetbase release to screenshot (e.g. v0.7.59), or 'latest' for the newest tag published for BOTH images"
        required: true
        default: 'latest'
      areas:
        description: 'Space-separated manifests to capture'
        required: true
        default: 'iam fleet-ops admin general developers ledger extensions'
      open_pr:
        description: 'Also open a pull request on fleetbase.io (needs FLEETBASE_IO_TOKEN)'
        type: boolean
        default: false
  repository_dispatch:
    types: [fleetbase-release]

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture console screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: cfg
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          # A release-triggered run carries the tag in the dispatch payload instead.
          [[ -z "$TAG" ]] && TAG="$DISPATCH_TAG"
          [[ -z "$TAG" ]] && TAG="latest"

          # "latest" is resolved to a concrete vX.Y.Z, never passed through. The :latest Docker
          # tag is ambiguous (which build? does console:latest match api:latest?), and the
          # artifact and pull request are named after the version they show. The newest tag
          # that exists for BOTH images is the answer — the publisher pushes them in one bake,
          # but a half-finished publish would otherwise pair a new API with an older console.
          if [[ "$TAG" == "latest" ]]; then
            TAG="$(python3 - <<'PY'
          import json, re, sys, urllib.request
          def tags(repo):
              out, url = set(), f"https://hub.docker.com/v2/repositories/fleetbase/{repo}/tags/?page_size=100"
              while url:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      page = json.load(r)
                  out |= {t["name"] for t in page["results"] if re.fullmatch(r"v\d+\.\d+\.\d+", t["name"])}
                  url = page.get("next")
              return out
          both = tags("fleetbase-console") & tags("fleetbase-api")
          if not both:
              sys.exit("no vX.Y.Z tag is published for both fleetbase-console and fleetbase-api")
          print(max(both, key=lambda t: tuple(int(n) for n in t[1:].split("."))))
          PY
          )"
          fi
          AREAS="${{ inputs.areas }}"
          [[ -z "$AREAS" ]] && AREAS="iam fleet-ops admin general developers ledger extensions"

          # Opening a pull request is opt-in for manual runs and, for release-triggered runs,
          # governed by the repository variable OPEN_PR_ON_RELEASE — so a release can be made
          # to just produce an artifact while the fixtures are still being tuned, and flipped
          # to "open the PR" with no workflow change.
          OPEN_PR=false
          [[ "${{ inputs.open_pr }}" == "true" ]] && OPEN_PR=true
          if [[ "${{ github.event_name }}" == "repository_dispatch" && "${{ vars.OPEN_PR_ON_RELEASE }}" == "true" ]]; then
            OPEN_PR=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "areas=$AREAS" >> "$GITHUB_OUTPUT"
          echo "open_pr=$OPEN_PR" >> "$GITHUB_OUTPUT"
          echo "Capturing $AREAS from $TAG (open_pr=$OPEN_PR)"

      - name: Require SHOWCASE_PASSWORD
        run: |
          if [[ -z "${{ secrets.SHOWCASE_PASSWORD }}" ]]; then
            echo "::error::SHOWCASE_PASSWORD is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Every Fleetbase image is pulled, never built — that is the point of screenshotting a
      # release rather than a branch. scripts/up.sh writes .env and waits on the healthchecks.
      # compare.mjs runs on the runner, not in the Playwright container, and the container
      # keeps its node_modules in a named volume — so nothing had ever installed them here
      # and compare died on `Cannot find package 'pixelmatch'` after a perfectly good capture.
      #
      # It has to happen BEFORE anything starts a container: Docker creates
      # capture/node_modules on the host as the mount point for that named volume, owned by
      # root, and npm then cannot write into it (EACCES).
      - name: Install compare dependencies
        if: steps.cfg.outputs.open_pr == 'true'
        working-directory: capture
        run: |
          npm ci --no-audit --no-fund
          mkdir -p .cache/domhash

      - name: Start the stack
        env:
          RELEASE_TAG: ${{ steps.cfg.outputs.tag }}
          # Opt-in: the Google Maps pass runs only when the repo variable GOOGLE_MAPS_PASS is
          # 'true' AND a key is available. The key alone is not enough on purpose — an
          # org-level GOOGLE_MAPS_API_KEY exists, and a key whose referrer restrictions do not
          # include http://proxy/* fails every Google entry, which would fail every run.
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_PASS == 'true' && secrets.GOOGLE_MAPS_API_KEY || '' }}
        run: ./scripts/up.sh

      - name: Provision
        run: ./scripts/provision.sh

      - name: Seed fixtures
        env:
          SHOWCASE_PASSWORD: ${{ secrets.SHOWCASE_PASSWORD }}
        run: ./scripts/seed.sh

      # capture.sh runs Chromium inside the pinned Playwright image on the compose network, the
      # same way it does locally. That is what keeps a screenshot taken on a laptop comparable
      # to one taken here — see the header of scripts/capture.sh.
      # The tile cache is deliberately not committed (OSM's usage policy), so it is carried
      # between runs here instead. Restore + explicit save rather than actions/cache alone,
      # because the implicit save only happens when the job succeeds — and a run that failed
      # on the twelfth screen still fetched every tile the first eleven needed.
      - name: Restore map tile cache
        id: tile-cache
        uses: actions/cache/restore@v4
        with:
          path: capture/.cache/tiles
          key: tiles-${{ hashFiles('capture/manifests/**', 'seeders/**') }}
          restore-keys: |
            tiles-

      # continue-on-error, deliberately. One screen whose selector broke must not cost the
      # other ninety-five their pull request — the point of the automation is that a release
      # refreshes the library without anyone babysitting it. The run still goes red: the last
      # step in the job fails on this step's outcome, after the PR has been opened, and the
      # PR body lists what is missing from it.
      - name: Capture
        id: capture
        continue-on-error: true
        env:
          SHOWCASE_PASSWORD: ${{ secrets.SHOWCASE_PASSWORD }}
          # Saves each screen's HTML into the artifact alongside the image, for diagnosing a
          # wrong-looking capture without a local stack. Cheap; always on.
          CAPTURE_DEBUG: '1'
        run: ./scripts/capture.sh ${{ steps.cfg.outputs.areas }}

      # The capture container runs as root and writes into the bind-mounted capture/, so
      # everything it produced — out/<area>/, .cache/tiles/ — is root-owned on the host.
      # Every later step runs as the runner user, and the ones that only read (artifact
      # upload, tile-cache save) are fine; compare is not, because it writes a diff/ directory
      # beside the captures. Hand the output back rather than fixing it at each symptom.
      - name: Take ownership of the capture output
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" capture/out capture/.cache 2>/dev/null || true

      # Unconditional: when a run fails partway, the screenshots it did manage are the fastest
      # way to see how far it got and what the failing screen looked like.
      - name: Save map tile cache
        if: always() && steps.tile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: capture/.cache/tiles
          key: ${{ steps.tile-cache.outputs.cache-primary-key }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-screenshots-${{ steps.cfg.outputs.tag }}
          path: capture/out
          retention-days: 14
          if-no-files-found: warn

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

      # ── Optional: propose the changes on fleetbase.io ────────────────────────────────────
      - name: Checkout fleetbase.io
        if: steps.cfg.outputs.open_pr == 'true'
        uses: actions/checkout@v4
        with:
          repository: fleetbase/fleetbase.io
          token: ${{ secrets.FLEETBASE_IO_TOKEN }}
          path: fleetbase-io

      # The DOM-hash baseline is compare.mjs's second gate: a screenshot whose pixels moved but
      # whose DOM hash did not is render noise, not a change worth a pull request. It only
      # works if the previous run's hashes survive to this one, which a job's filesystem does
      # not. Always restore the newest baseline (restore-keys), always save a new one.
      - name: Restore DOM-hash baseline
        if: steps.cfg.outputs.open_pr == 'true'
        id: domhash-cache
        uses: actions/cache/restore@v4
        with:
          path: capture/.cache/domhash
          key: domhash-${{ github.run_id }}
          restore-keys: |
            domhash-

      - name: Compare against the published library
        if: steps.cfg.outputs.open_pr == 'true'
        id: compare
        run: |
          set -euo pipefail
          total=0
          for area in ${{ steps.cfg.outputs.areas }}; do
            echo "::group::$area"
            # One baseline file per area: entry ids are only unique within a manifest.
            node capture/bin/compare.mjs \
              --new "capture/out/$area" \
              --current "fleetbase-io/public/images/screenshots/$area" \
              --staged "fleetbase-io/public/images/screenshots/$area" \
              --report "capture/out/$area/report.json" \
              --hash-baseline "capture/.cache/domhash/$area.json"
            echo "::endgroup::"
          done
          cd fleetbase-io
          total="$(git status --porcelain public/images/screenshots | wc -l | tr -d ' ')"
          echo "changed=$total" >> "$GITHUB_OUTPUT"

      # Saved even when the PR step is skipped (nothing changed) or fails: the hashes describe
      # this run's captures either way, and the next run should compare against them.
      - name: Save DOM-hash baseline
        if: always() && steps.compare.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: capture/.cache/domhash
          key: ${{ steps.domhash-cache.outputs.cache-primary-key }}

      - name: Collect capture failures
        if: steps.cfg.outputs.open_pr == 'true'
        id: failures
        run: |
          set -euo pipefail
          {
            echo 'list<<CAPTURE_FAILURES_EOF'
            for area in ${{ steps.cfg.outputs.areas }}; do
              f="capture/out/$area/failures.json"
              [ -s "$f" ] || continue
              node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).forEach((r) => console.log('- ' + process.argv[2] + '/' + r.id + ' — ' + String(r.message || '').slice(0, 160)))" "$f" "$area"
            done
            echo CAPTURE_FAILURES_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.cfg.outputs.open_pr == 'true' && steps.compare.outputs.changed != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          path: fleetbase-io
          token: ${{ secrets.FLEETBASE_IO_TOKEN }}
          base: main
          branch: automation/console-screenshots/${{ steps.cfg.outputs.tag }}
          delete-branch: true
          add-paths: public/images/screenshots/**
          commit-message: 'Refresh console screenshots for ${{ steps.cfg.outputs.tag }}'
          title: 'Refresh console screenshots for ${{ steps.cfg.outputs.tag }}'
          labels: automated
          body: |
            Captured from `${{ steps.cfg.outputs.tag }}` by
            [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Areas: `${{ steps.cfg.outputs.areas }}`.

            Review these on the Vercel preview rather than in the binary diff. Files without a
            suffix are dark, matching the existing library; `-light.webp` files are new and
            nothing on the site consumes them yet.

            ${{ steps.failures.outputs.list != '' && '**Not in this pull request.** These screens failed to capture:' || '' }}
            ${{ steps.failures.outputs.list }}

      # Last, so it cannot stop the pull request being opened: the run goes red whenever a
      # screen failed, which is what gets someone to look at the debug HTML in the artifact.
      - name: Fail the run if any screen failed to capture
        if: always() && steps.capture.outcome == 'failure'
        run: |
          echo "::error::The capture step reported failures; see the log and the debug HTML in the artifact."
          exit 1
