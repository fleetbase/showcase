# Publishes the screenshot galleries to GitHub Pages, https://fleetbase.github.io/showcase/:
#
#   /console/          the Console Screenshots workflow's `console-gallery` artifact
#   /storefront-app/   the Storefront app screenshots workflow's `storefront-app-gallery`
#
# Runs after either workflow finishes on main, whatever its outcome: a run with failures still
# has a gallery, with the gaps marked and the failures listed. A deploy replaces the whole site,
# so every deploy carries both galleries: the newest main run of each workflow whose gallery
# artifact has not expired. Run it by hand to deploy the newest again.
name: Publish gallery

on:
  workflow_run:
    workflows: [Console Screenshots, Storefront app screenshots]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: capture/gallery

      # The newest main run of each workflow that still has its gallery artifact.
      - name: Find the galleries
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          newest() {
            local workflow="$1" artifact="$2" id
            for id in $(gh api "repos/${{ github.repository }}/actions/workflows/$workflow/runs?branch=main&status=completed&per_page=30" --jq '.workflow_runs[].id'); do
              if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.expired | not) | .name' | grep -qx "$artifact"; then
                echo "$id"
                return
              fi
            done
          }
          console="$(newest screenshots.yml console-gallery)"
          app="$(newest storefront-app-screenshots.yml storefront-app-gallery)"
          echo "console=$console" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Console gallery: run ${console:-none}; Storefront app gallery: run ${app:-none}"
          if [[ -z "$console$app" ]]; then
            echo "::notice::No gallery artifact on main yet; nothing to publish."
          fi

      - uses: actions/download-artifact@v4
        if: steps.find.outputs.console != ''
        with:
          name: console-gallery
          path: site/console
          run-id: ${{ steps.find.outputs.console }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: steps.find.outputs.app != ''
        with:
          name: storefront-app-gallery
          path: site/storefront-app
          run-id: ${{ steps.find.outputs.app }}
          github-token: ${{ github.token }}

      - name: Landing page
        if: steps.find.outputs.console != '' || steps.find.outputs.app != ''
        run: cp capture/gallery/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.find.outputs.console != '' || steps.find.outputs.app != ''
        with:
          path: site

      - id: deploy
        if: steps.find.outputs.console != '' || steps.find.outputs.app != ''
        uses: actions/deploy-pages@v4
